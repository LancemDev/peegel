[package]
name = "peegel"
version = "0.1.0"
description = "Shared clipboard between Android and Linux over local Wi-Fi"
authors = ["LancemDev"]
license = "MIT"
repository = "https://github.com/LancemDev/peegel"
edition = "2021"
rust-version = "1.80"

[lib]
name = "peegel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "peegel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
directories = "6.0.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
hkdf = "0.12.4"
if-addrs = "0.15.0"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
log = "0.4.34"
mdns-sd = "0.21.6"
qrcode = "0.14.1"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4.5"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.29.0"
uuid = { version = "1.20.0", features = ["v4"] }
wl-clipboard-rs = "0.9.5"

[build-dependencies]
tauri-build = "2.6.3"
